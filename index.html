cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BananaMod Launcher</title>
    <!-- Holt das Skript für den 3D-Skin aus dem Web -->
    <script src="https://bundle.run/skinview3d@3.0.0-alpha.1"></script>
    <style>
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background-color: #111114;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 3px 0 15px rgba(0, 0, 0, 0.6);
            z-index: 10;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
        }

        .brand {
            display: flex;
            align-items: center;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #00ebff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00ebff, #0072ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #8e8e93;
            padding: 14px 16px;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: #1c1c21;
            color: #00ebff;
            transform: translateX(3px);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, rgba(0, 235, 255, 0.15), rgba(0, 114, 255, 0.15));
            color: #00ebff;
            border-left: 3px solid #00ebff;
            padding-left: 13px;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #16161c 0%, #0a0a0c 100%);
        }

        #skin-container {
            width: 220px;
            height: 280px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8);
        }

        .name-input {
            background-color: #16161f;
            border: 2px solid #262630;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 10px;
            width: 260px;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 25px;
            transition: all 0.2s ease;
        }

        .name-input:focus {
            border-color: #00ebff;
            box-shadow: 0 0 15px rgba(0, 235, 255, 0.2);
        }

        .launch-btn {
            background: linear-gradient(135deg, #00ebff 0%, #0072ff 100%);
            color: #ffffff;
            border: none;
            padding: 16px 55px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 235, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Linkes Menü mit dem neuen Profile-Button -->
    <div class="sidebar">
        <div class="brand">
            <span class="logo-text">BananaMod</span>
        </div>
        <button class="nav-btn active">Launcher</button>
        <button class="nav-btn">Profile</button>
        <button class="nav-btn">Skins</button>
        <button class="nav-btn">Mods</button>
        <button class="nav-btn">Einstellungen</button>
    </div>

    <!-- Rechter Bereich mit der Skin-Vorschau -->
    <div class="main-content">
        <div id="skin-container"></div>
        <input type="text" class="name-input" id="username" placeholder="Minecraft Namen..." value="Jakob">
        <button class="launch-btn" onclick="alert('Starte Minecraft als ' + document.getElementById('username').value + '...')">SPIELEN</button>
    </div>

    <!-- Das Javascript für den 3D-Avatar -->
    <script>
        const skinViewer = new skinview3d.SkinViewer({
            canvas: document.createElement("canvas"),
            width: 220,
            height: 280,
            skin: "https://mineskin.org/assets/img/steve.png"
        });
        document.getElementById("skin-container").appendChild(skinViewer.canvas);
        skinViewer.animations.add(skinview3d.WalkingAnimation);
        skinViewer.animations.runAnimation();
        skinViewer.autoRotate = true;
        skinViewer.autoRotateSpeed = 0.6;
    </script>

</body>
</html>
EOF
